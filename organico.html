<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reporte de Performance Orgánico — Grupo Neruc</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&family=DM+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
/* === Extensión del canon: tarjetas de publicación destacada === */
.post-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.post-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 18px; border-top: 3px solid #e2e8f0; }
.post-card.best { border-top-color: #10b981; }
.post-card.worst { border-top-color: #ef4444; }
.post-card .post-tag { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; font-family: "DM Mono", monospace; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
.post-card.best .post-tag { color: #10b981; }
.post-card.worst .post-tag { color: #ef4444; }
.post-card .post-thumb { width: 100%; aspect-ratio: 4/3; border-radius: 8px; background: linear-gradient(135deg,#ede9fe,#f8fafc); display: flex; align-items: center; justify-content: center; font-size: 34px; margin-bottom: 12px; border: 1px solid #e2e8f0; }
.post-card .post-title { font-size: 13.5px; font-weight: 700; color: #0f172a; margin-bottom: 4px; line-height: 1.4; }
.post-card .post-meta { font-size: 11px; color: #94a3b8; font-family: "DM Mono", monospace; margin-bottom: 12px; }
.post-stats { display: flex; gap: 16px; margin-bottom: 14px; }
.post-stats div { flex: 1; }
.post-stats .n { font-size: 17px; font-weight: 800; font-family: "DM Mono", monospace; color: #0f172a; }
.post-stats .l { font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase; color: #94a3b8; font-family: "DM Mono", monospace; }
.post-link { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: #7c3aed; text-decoration: none; padding: 8px 14px; border: 1px solid #e9d8fd; background: #faf5ff; border-radius: 8px; }
.post-link:hover { background: #f3e8ff; }
.red-header { font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; font-family: "DM Mono", monospace; font-weight: 700; color: #ffffff; background: linear-gradient(90deg,#0a0d14,#1a0a3e 55%,#2d1b5e); padding: 12px 18px; border-radius: 10px; margin-bottom: 20px; }
.red-block + .red-block { margin-top: 0; }
.red-top { break-inside: avoid; page-break-inside: avoid; padding-top: 16px; }
.row-link { font-size: 11.5px; font-weight: 700; color: #7c3aed; text-decoration: none; }
.row-link:hover { text-decoration: underline; }
.pdf-btn { display: inline-flex; align-items: center; gap: 8px; background: #7c3aed; color: #fff; border: none; border-radius: 8px; padding: 10px 18px; font-size: 13px; font-weight: 700; font-family: "DM Sans", sans-serif; cursor: pointer; margin-bottom: 32px; }
.pdf-btn:hover { background: #6d28d9; }
@media (max-width: 600px) { .post-grid { grid-template-columns: 1fr; } }
@media print {
  .pdf-btn, .month-picker { display: none !important; }
  body { background: #fff; }
  .post-card, .kpi-card, .chart-box { break-inside: avoid; }
  .section { break-inside: avoid; }
}
/* === Ajustes de formato (2026-11-04): KPIs sin tarjetas huérfanas, tabla compacta de una línea, miniaturas sin recorte en PDF === */
.kpi-grid.n3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.kpi-grid.n5, .pdf-exporting .kpi-grid.n5 { grid-template-columns: repeat(5, minmax(0,1fr)); }
.kpi-grid.n6, .pdf-exporting .kpi-grid.n6 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.pdf-exporting .kpi-grid.n3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.kpi-grid.n5 .kpi-card { padding: 16px; }
.kpi-grid.n5 .kpi-card .val { font-size: 22px; }
.kpi-grid .kpi-card .lbl { min-height: 24px; align-items: flex-start; }
.post-card .post-thumb.has-img { background-color: #f8fafc; background-repeat: no-repeat; background-position: center; background-size: contain; aspect-ratio: auto; height: 260px; }
.pdf-exporting .post-card .post-thumb.has-img { height: 165px; margin-bottom: 8px; }
.pdf-exporting .post-card .post-thumb { aspect-ratio: auto; height: 120px; }
.pdf-exporting .post-card { padding: 12px 14px; }
.pdf-exporting .post-card .post-title { font-size: 12px; margin-bottom: 2px; }
.pdf-exporting .post-card .post-meta { margin-bottom: 8px; }
.pdf-exporting .post-stats { margin-bottom: 8px; }
.pdf-exporting .post-stats .n { font-size: 15px; }
.pdf-exporting .post-link { padding: 5px 10px; font-size: 11px; }
.pdf-exporting .red-top { padding-top: 6px; }
.pdf-exporting .kpi-grid.n5 .kpi-card, .pdf-exporting .kpi-grid.n6 .kpi-card { padding: 10px 12px; }
.pdf-exporting .kpi-grid.n5 .kpi-card .val { font-size: 18px; }
.pdf-exporting .kpi-grid { margin-bottom: 20px; }
.pdf-exporting .section { margin-bottom: 20px; }
table.results.org { table-layout: fixed; }
table.results.org th, table.results.org td { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 8px 10px; vertical-align: middle; }
table.results.org th:nth-child(1) { width: 13%; } table.results.org th:nth-child(2) { width: 12%; }
table.results.org th:nth-child(4) { width: 15%; text-align: right; } table.results.org th:nth-child(5) { width: 14%; text-align: right; } table.results.org th:nth-child(6) { width: 8%; text-align: center; }
table.results.org td:nth-child(4), table.results.org td:nth-child(5) { text-align: right; font-family: "DM Mono", monospace; }
table.results.org td:nth-child(6) { text-align: center; }
table.results.org tbody tr:nth-child(even) td { background: #f8fafc; }
.pdf-exporting table.results.org td { padding-top: 3px; padding-bottom: 3px; font-size: 10px; line-height: 1.3; }
.pdf-exporting table.results.org th { padding-top: 6px; padding-bottom: 6px; }
.sec-tabla, .pdf-exporting .sec-tabla, .sec-tabla table.results { break-inside: auto; page-break-inside: auto; }
table.results.org tr { break-inside: avoid; page-break-inside: avoid; }
.pdf-exporting .red-block + .red-block .red-top { padding-top: 0; }
.pdf-exporting .red-top > .footer { margin: 28px -24px 0; }
@media (max-width: 600px) { .kpi-grid.n5, .kpi-grid.n6, .kpi-grid.n3 { grid-template-columns: repeat(2, minmax(0,1fr)); } }
</style>
</head>
<body>

<div id="app"></div>

<script>
async function init() {
  const params = new URLSearchParams(window.location.search);
  const slug = params.get('c');
  const app = document.getElementById('app');

  if (!slug) {
    app.innerHTML = renderState('🔗', 'Falta el link completo', 'Este enlace parece incompleto. Usa el link exacto que te compartió Grupo Neruc, incluyendo la parte final después de "?c=".');
    return;
  }

  let data;
  try {
    const res = await fetch('data/organico-' + encodeURIComponent(slug) + '.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('not found');
    data = await res.json();
  } catch (e) {
    app.innerHTML = renderState('🕓', 'Aún no hay resultados aquí', 'Todavía no se ha publicado un reporte para este link. Si crees que esto es un error, contacta a tu contacto en Grupo Neruc.');
    return;
  }

  render(data);
}

function renderState(icon, title, text) {
  return `${headerHTML(null)}<div class="state-box"><div class="icon">${icon}</div><h2>${title}</h2><p>${text}</p></div>${footerHTML()}`;
}

function headerHTML(clientName) {
  return `
  <div class="header">
    <div class="header-inner">
      <div class="header-brand">
        <img src="assets/shield-canonical.svg" alt="Neruc">
        <div><div class="name">GRUPO NERUC</div><div class="sub">RESULTADOS DE REDES</div></div>
      </div>
      ${clientName ? `<div class="header-meta"><div class="lbl">CLIENTE</div><div class="val">${escapeHTML(clientName)}</div></div>` : ''}
    </div>
  </div>`;
}
function footerHTML() { return `<div class="footer">GRUPO NERUC · PORTAL DE RESULTADOS · CONFIDENCIAL</div>`; }
function escapeHTML(str) { const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }
function fmtNum(n) { return Number(n).toLocaleString('es-MX', { maximumFractionDigits: 2 }); }

function fmtDelta(curr, prev, unit) {
  if (prev === null || prev === undefined || prev === 0) return '';
  const pct = unit === 'pp' ? (curr - prev) : ((curr - prev) / Math.abs(prev) * 100);
  const cls = pct > 0 ? 'up' : pct < 0 ? 'down' : 'flat';
  const arrow = pct > 0 ? '▲' : pct < 0 ? '▼' : '—';
  const suffix = unit === 'pp' ? ' pp' : '%';
  return `<div class="delta ${cls}">${arrow} ${Math.abs(pct).toFixed(1)}${suffix} vs mes anterior</div>`;
}

function lineChart(title, points, fmt) {
  const pts = points.filter(p => p.value != null);
  if (pts.length < 2) return '';
  const w = 640, h = 170, padX = 26, padTop = 30, padBottom = 24;
  const values = pts.map(p => p.value);
  const min = Math.min(...values), max = Math.max(...values);
  const range = (max - min) || Math.max(max, 1);
  const stepX = (w - padX * 2) / (pts.length - 1);
  const coords = pts.map((p, i) => ({ x: padX + i * stepX, y: h - padBottom - ((p.value - min) / range) * (h - padTop - padBottom), ...p }));
  const pathD = coords.map((c, i) => (i === 0 ? 'M' : 'L') + c.x.toFixed(1) + ' ' + c.y.toFixed(1)).join(' ');
  const label = v => fmt ? fmt(v) : fmtNum(v);
  const dots = coords.map(c => `<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="4" fill="#7c3aed"><title>${escapeHTML(c.label)}: ${escapeHTML(label(c.value))}</title></circle>`).join('');
  const last = coords[coords.length - 1];
  const endLabel = `<text x="${last.x.toFixed(1)}" y="${(last.y - 12).toFixed(1)}" text-anchor="middle" class="chart-endlabel">${escapeHTML(label(last.value))}</text>`;
  const xLabels = coords.map(c => `<text x="${c.x.toFixed(1)}" y="${h - 6}" text-anchor="middle" class="chart-xlabel">${escapeHTML(c.label)}</text>`).join('');
  return `<div class="chart-box"><div class="chart-box-title">${escapeHTML(title)}</div><svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" class="linechart" preserveAspectRatio="xMidYMid meet"><path d="${pathD}" fill="none" stroke="#7c3aed" stroke-width="2"/>${dots}${endLabel}${xLabels}</svg></div>`;
}

const TIPO_ICON = { 'Reel': '🎬', 'Carrusel': '🖼️', 'Imagen': '📷', 'Historia': '⏱️', 'Video': '🎥' };

// En el PDF, el footer viaja dentro de la última sección visible para que nunca quede solo en una hoja
function anchorFooterForPdf(app) {
  const footer = app.querySelector('.footer');
  const sections = [...app.querySelectorAll('.wrap .section, .wrap .red-top')].filter(s => !s.classList.contains('no-pdf'));
  const last = sections[sections.length - 1];
  if (!footer || !last) return () => {};
  const parent = footer.parentNode, next = footer.nextSibling;
  last.appendChild(footer);
  last.classList.add('pdf-last');
  return () => { last.classList.remove('pdf-last'); parent.insertBefore(footer, next); };
}

function pdfSlug(str) {
  return String(str || 'reporte')
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-zA-Z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '');
}

// Paginación del PDF: html2pdf corta el lienzo cada "pageH" px. Antes de exportar, al ancho real de la hoja (725px),
// se insertan espaciadores para que ninguna red empiece sin espacio para sus KPIs + primera sección, ninguna tarjeta/fila quede partida y ninguna tabla
// empiece con menos de 3 filas al pie de una hoja. Devuelve la función que deshace todo.
function paginarPdf(app) {
  const prevW = app.style.width;
  app.style.width = '725px';
  const W = app.getBoundingClientRect().width;
  const pageH = Math.floor(W * 2 * (279.4 - 28) / (215.9 - 24)) / 2;
  const added = [];
  const top = el => el.getBoundingClientRect().top - app.getBoundingClientRect().top;
  const spacerBefore = (el, h) => {
    let sp;
    if (el.tagName === 'TR') { sp = document.createElement('tr'); sp.innerHTML = `<td colspan="${el.children.length}" style="height:${h}px;padding:0;border:0;background:#fff"></td>`; }
    else { sp = document.createElement('div'); sp.style.height = h + 'px'; }
    el.parentNode.insertBefore(sp, el); added.push(sp);
  };
  const fit = (el, h, forceNew) => {
    const y = top(el), pos = y % pageH, rest = pageH - pos;
    if ((forceNew && pos > 2) || (!forceNew && h < pageH && pos + h > pageH - 2)) spacerBefore(el, rest + 1);
  };
  const blocks = [...app.querySelectorAll('.red-block')];
  blocks.forEach((b, i) => {
    if (i > 0) {  // la red arranca en hoja nueva solo si su encabezado + KPIs + primera sección no caben en lo que queda
      const rt = b.querySelector('.red-top'), nx = rt && rt.nextElementSibling;
      const end = (nx || rt).getBoundingClientRect().bottom;
      fit(b, end - b.getBoundingClientRect().top, false);
    }
    for (const el of b.children) {
      if (el.classList.contains('sec-tabla')) {
        const rows = [...el.querySelectorAll('tbody tr')];
        const anchor = rows[Math.min(2, rows.length - 1)];
        const t = el.querySelector('.section-title') || el;
        fit(t, anchor ? anchor.getBoundingClientRect().bottom - t.getBoundingClientRect().top : 0, false);
        for (let k = 3; k < rows.length; k++) {
          const r = rows[k], y = top(r), h = r.getBoundingClientRect().height, pos = y % pageH;
          if (pos + h <= pageH - 2) continue;
          // no dejar menos de 3 filas solas en la hoja siguiente: se pasan las últimas 3 juntas
          const t2 = (rows.length - k < 3 && rows.length - 3 >= 3) ? rows[rows.length - 3] : r;
          spacerBefore(t2, pageH - (top(t2) % pageH) + 1);
          if (t2 !== r) break;
        }
      } else fit(el, el.getBoundingClientRect().height, false);
    }
  });
  const footer = app.querySelector('.footer');
  if (footer) fit(footer, footer.getBoundingClientRect().height, false);
  return () => { added.forEach(x => x.remove()); app.style.width = prevW; };
}

function attachPdfHandler(clienteNombre, mesLabel) {
  const btn = document.getElementById('pdf-btn');
  if (!btn) return;
  btn.addEventListener('click', () => {
    if (typeof html2pdf === 'undefined') {
      alert('No se pudo cargar el generador de PDF. Revisa tu conexión e intenta de nuevo.');
      return;
    }
    const app = document.getElementById('app');
    const originalLabel = btn.textContent;
    app.classList.add('pdf-exporting');
    const restoreFooter = anchorFooterForPdf(app);
    const restorePag = paginarPdf(app);
    btn.disabled = true;
    btn.textContent = 'Generando PDF...';

    const filename = `${pdfSlug(clienteNombre)}_${pdfSlug(mesLabel)}.pdf`;

    requestAnimationFrame(() => requestAnimationFrame(() => {
      html2pdf().set({
        margin: [12, 12, 16, 12],
        filename,
        image: { type: 'jpeg', quality: 0.95 },
        html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff' },
        jsPDF: { unit: 'mm', format: 'letter', orientation: 'portrait' },
        pagebreak: { mode: ['legacy'] }
      }).from(app).save()
        .catch(() => alert('Hubo un problema generando el PDF. Intenta de nuevo.'))
        .then(() => {
          restorePag();
          restoreFooter();
          app.classList.remove('pdf-exporting');
          btn.disabled = false;
          btn.textContent = originalLabel;
        });
    }));
  });
}

function postCard(kind, label, post, metrica) {
  if (!post) return '';
  const isBest = kind === 'best';
  return `
    <div class="post-card ${kind}">
      <div class="post-tag">${isBest ? '🏆' : '📉'} ${escapeHTML(label)}</div>
      ${post.imagen ? `<div class="post-thumb has-img" role="img" aria-label="${escapeHTML(post.titulo)}" style="background-image:url('${escapeHTML(post.imagen)}')"></div>` : `<div class="post-thumb">${TIPO_ICON[post.tipo] || '📱'}</div>`}
      <div class="post-title">${escapeHTML(post.titulo)}</div>
      <div class="post-meta">${escapeHTML(post.tipo)} · ${escapeHTML(post.fecha)}</div>
      <div class="post-stats">
        <div><div class="n">${fmtNum(post.alcance)}</div><div class="l">${escapeHTML(metrica || 'Alcance')}</div></div>
        <div><div class="n">${fmtNum(post.interacciones)}</div><div class="l">Interacciones</div></div>
        <div><div class="n">${post.tasa != null ? post.tasa + '%' : '—'}</div><div class="l">Tasa interac.</div></div>
      </div>
      ${post.link ? `<a href="${escapeHTML(post.link)}" target="_blank" rel="noopener" class="post-link">Ver publicación ↗</a>` : ''}
    </div>`;
}

function render(data) {
  document.title = 'Reporte de Performance Orgánico — ' + (data.cliente_nombre || 'Grupo Neruc');
  const app = document.getElementById('app');
  const months = data.meses || [];
  const currentMonthKey = months.length ? months[months.length - 1].mes : null;
  // Redes por mes: Facebook vive en la raíz del mes; las demás en su propio objeto (ej. "instagram").
  // Si el mes trae más de una red, se muestran todas apiladas, cada una con su encabezado.
  const REDES = [
    { key: 'facebook', label: 'Facebook', get: mm => mm },
    { key: 'instagram', label: 'Instagram', get: mm => mm.instagram || null },
    { key: 'tiktok', label: 'TikTok', get: mm => mm.tiktok || null },
  ];

  function redBlock(red, m, prev, idx, showHeader) {
    const KPI_DEFS = [
      { key:'seguidores_totales', label:'Seguidores totales', icon:'👥', unit:null },
      { key:'seguidores_nuevos', label:'Seguidores nuevos', icon:'📈', unit:'%', prefix:'+' },
      { key:'publicaciones_subidas', label:'Publicaciones subidas', icon:'📤', unit:'%' },
      { key:'alcance_organico', label: m.alcance_label || 'Alcance orgánico', icon:'🌐', unit:'%' },
      { key:'interacciones_totales', label:'Interacciones totales', icon:'❤️', unit:'%' },
      { key:'tasa_interaccion', label:'Tasa de interacción', icon:'💬', unit:'pp', suffix:'%' },
    ];
    const kpis = KPI_DEFS.map(def => {
      const val = m[def.key];
      if (val == null) return '';
      const shown = (def.prefix || '') + fmtNum(val) + (def.suffix || '');
      // Si la métrica de alcance cambió de un mes a otro (ej. Meta quitó "Alcance" del export y quedó "Visualizaciones"), no se compara
      const mismaMetrica = !prev || (m.alcance_label || '') === (prev.alcance_label || '') || !['alcance_organico', 'tasa_interaccion'].includes(def.key);
      const delta = def.unit && mismaMetrica ? fmtDelta(val, prev ? prev[def.key] : null, def.unit) : '';
      return `<div class="kpi-card"><div class="lbl"><span class="kpi-icon">${def.icon}</span>${def.label}</div><div class="val">${shown}</div>${delta}</div>`;
    }).join('');

    const nK = KPI_DEFS.filter(def => m[def.key] != null).length;
    const seriePts = key => months.slice(0, idx + 1).map(mm => ({ label: (mm.mes_label || mm.mes).split(' ')[0].slice(0,3), value: (red.get(mm) || {})[key] }));
    const chartSeguidores = lineChart('Seguidores nuevos por mes', seriePts('seguidores_nuevos'), v => '+' + fmtNum(v));
    const chartPublicaciones = lineChart('Publicaciones subidas por mes', seriePts('publicaciones_subidas'));
    const evolucion = (chartSeguidores || chartPublicaciones) ? `<div class="section"><div class="section-title">Evolución mensual</div><div class="chart-grid">${chartSeguidores}${chartPublicaciones}</div></div>` : '';

    const posts = m.publicaciones || [];
    const hasLinks = posts.some(p => p.link);
    const postsRows = [...posts].sort((a,b) => b.interacciones - a.interacciones).map(p => `
      <tr><td>${escapeHTML(p.fecha)}</td><td>${TIPO_ICON[p.tipo] || ''} ${escapeHTML(p.tipo)}</td><td title="${escapeHTML(p.titulo)}">${escapeHTML(p.titulo)}</td><td>${fmtNum(p.alcance)}</td><td>${fmtNum(p.interacciones)}</td>${hasLinks ? `<td>${p.link ? `<a href="${escapeHTML(p.link)}" target="_blank" rel="noopener" class="row-link">Ver ↗</a>` : '—'}</td>` : ''}</tr>`).join('');

    return `
      <div class="red-block">
        <div class="red-top">
          ${showHeader ? `<div class="red-header">${escapeHTML(red.label)}</div>` : ''}
          <div class="kpi-grid n${nK}">${kpis}</div>
        </div>

        ${evolucion}

        ${(m.mejor_publicacion || m.peor_publicacion) ? `<div class="section">
          <div class="section-title">Destacados del mes</div>
          <div class="post-grid">${postCard('best', 'Mejor desempeño', m.mejor_publicacion, m.metrica_post)}${postCard('worst', 'Menor desempeño', m.peor_publicacion, m.metrica_post)}</div>
        </div>` : ''}

        ${posts.length ?`<div class="section sec-tabla"><div class="section-title">Detalle de publicaciones</div><div class="table-scroll"><table class="results org"><thead><tr><th>Fecha</th><th>Tipo</th><th>Publicación</th><th>${escapeHTML(m.metrica_post || 'Alcance')}</th><th>Interacciones</th>${hasLinks ? '<th>Link</th>' : ''}</tr></thead><tbody>${postsRows}</tbody></table></div></div>` : ''}
      </div>`;
  }

  function renderMonth(mesKey) {
    const idx = months.findIndex(m => m.mes === mesKey);
    const mesObj = idx >= 0 ? months[idx] : months[months.length - 1];
    if (!mesObj) return;

    const chips = months.map(mm => `<div class="month-chip ${mm.mes === mesObj.mes ? 'active' : ''}" data-mes="${mm.mes}">${escapeHTML(mm.mes_label || mm.mes)}</div>`).join('');

    const redesMes = REDES.filter(r => r.get(mesObj));
    const blocks = redesMes.map(r => redBlock(r, r.get(mesObj), idx > 0 ? r.get(months[idx - 1]) : null, idx, redesMes.length > 1)).join('');

    app.innerHTML = `
      ${headerHTML(data.cliente_nombre)}
      <div class="wrap">
        <div class="eyebrow">REPORTE MENSUAL</div>
        <h1 class="title">Reporte de Performance Orgánico — <b>${escapeHTML(data.cliente_nombre || 'tu cuenta')}</b></h1>
        <div class="subtitle">${escapeHTML(data.red_social || 'Instagram & Facebook')} · Grupo NERUC — última actualización: ${escapeHTML(data.actualizado || '')}</div>

        <button type="button" class="pdf-btn no-pdf" id="pdf-btn">📄 Descargar PDF</button>

        <div class="month-picker no-pdf">${chips}</div>

        ${blocks}
      </div>
      ${footerHTML()}
    `;

    attachPdfHandler(data.cliente_nombre, mesObj.mes_label || mesObj.mes);
    document.querySelectorAll('.month-chip').forEach(chip => chip.addEventListener('click', () => renderMonth(chip.dataset.mes)));
  }

  renderMonth(currentMonthKey);
}

init();
</script>

</body>
</html>
